services:
  redis:
    image: redis:alpine
    command: redis-server --requirepass 123456
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  velox:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - DB_HOST=database
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    env_file: .env

  # The judge's workers (`exec serve`; Interval's ADR-0041): every run in a fresh sandbox
  # container on this host's Docker. Run directories are bind-mounted into those
  # containers by path, so EXEC_WORK_DIR is the same path on the host and in here.
  # EXEC_RUNTIME=runsc (gVisor) wherever player code runs.
  judge-worker:
    build:
      context: .
      dockerfile: build/Dockerfile.exec
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - EXEC_WORK_DIR=/tmp/velox-exec
      - EXEC_RUNTIME=${EXEC_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/velox-exec:/tmp/velox-exec

  api:
    build:
      context: .
      dockerfile: build/Dockerfile.api
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - DB_HOST=database
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    env_file: .env

volumes:
  postgres_data:
